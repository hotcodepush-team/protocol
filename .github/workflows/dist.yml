name: Dist

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dist
  cancel-in-progress: false

jobs:
  dist:
    name: Append main and its build output to the dist branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Drop the scripts, since npm prepares a git dependency whose package.json has a build or install script
        run: node -e "const fs = require('fs'); const p = JSON.parse(fs.readFileSync('package.json', 'utf8')); delete p.scripts; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\\n');"
      - name: Commit main's tree plus dist/ onto the dist branch, never force-pushed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin dist:dist || git branch dist
          git symbolic-ref HEAD refs/heads/dist
          git add -A
          git add -f dist
          git commit -m "build: main@$(git rev-parse --short "$GITHUB_SHA")"
          git push origin dist
